<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4fc4">
<title>Mes exercices aménagés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Lexend:wght@400;600;700&family=Nunito:wght@400;600;700&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
:root{--violet:#5b4fc4;--fond:#f6f4ff;--texte:#2a2550;--doux:#6b6690;--bord:#d9d4f2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:'Lexend',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.ecran{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:6px 0 4px;line-height:1.2}
h2{font-size:19px;margin:22px 0 8px}
p{line-height:1.5}
.hint{color:var(--doux);font-size:14px;margin:4px 0}
.logo{font-size:54px;text-align:center;margin-top:20px}
.carte{background:#fff;border:1.5px solid var(--bord);border-radius:18px;padding:16px;margin-top:14px}
input[type=text],select,textarea{font:inherit;font-size:18px;width:100%;padding:12px 14px;border:2px solid var(--bord);border-radius:12px;background:#fff;color:var(--texte)}
input[type=text]:focus,select:focus,textarea:focus{outline:3px solid #b9b0f0;border-color:var(--violet)}
#code{text-transform:uppercase;letter-spacing:.12em;text-align:center;font-size:24px;font-weight:700}
.btn{font:inherit;font-size:17px;font-weight:600;border:2px solid var(--violet);background:#fff;color:var(--violet);border-radius:14px;padding:12px 16px;min-height:52px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--violet);color:#fff}
.btn.large{width:100%;font-size:19px;min-height:60px}
.btn:disabled{opacity:.5}
.rang{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.rang>.btn{flex:1 1 140px}
.choix2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choix2 .btn{font-size:15px;flex-direction:column;gap:2px;padding:10px}
.choix2 .btn small{font-weight:400;font-size:12.5px;opacity:.85}
.choix2 .btn[aria-pressed=true]{background:var(--violet);color:#fff}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photos .ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#ddd}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.msg{min-height:24px;margin-top:12px;font-weight:600;text-align:center}
.msg.err{color:#b3261e}
.attente{text-align:center;padding:40px 10px}
.rond{width:64px;height:64px;border:7px solid #e2ddfb;border-top-color:var(--violet);border-radius:50%;margin:20px auto;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.barre{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1.5px solid var(--bord);padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.barre .btn{flex:1 1 0;font-size:13.5px;min-height:44px;padding:6px 6px;border-radius:11px;white-space:nowrap}
.xp-profs{grid-template-columns:repeat(2,1fr)!important}.xp-prof{overflow-wrap:normal!important;font-size:15px!important}
@media(min-width:460px){.xp-profs{grid-template-columns:repeat(3,1fr)!important}}
.reserves{max-width:720px;margin:10px auto 0;padding:0 16px;font-size:14px;color:#7a4b00}
.reserves summary{cursor:pointer;font-weight:600}
#jeu{background:#fafaff;min-height:70vh}
#jeu .xq{max-width:760px;margin:0 auto}
.titre-exo{font:700 20px 'Lexend',system-ui,sans-serif;max-width:720px;margin:14px auto 0;padding:0 16px;color:#2a2550}
.discret{display:block;margin:18px auto 0;background:none;border:0;color:var(--doux);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
[hidden]{display:none!important}
/* copie A4 (impression), reprise de l'atelier */
#copie{position:absolute;left:-10000px;top:0;width:794px}
.stage{width:1414px;height:1000px;background:var(--paper,#fffdf7);border-radius:14px;overflow:hidden;font-family:'Patrick Hand',cursive;position:relative;color:#222}
.stage svg.branches{position:absolute;left:0;top:0;pointer-events:none}
.stage .foot{position:absolute;left:58px;bottom:58px;font-size:17px;color:#444;font-family:system-ui,sans-serif}
.stage .mark{position:absolute;right:58px;bottom:58px;font-size:19px;color:#444;font-family:system-ui,sans-serif}
.stage.fiche{background:transparent;overflow:visible;border-radius:0;font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;gap:24px}
.stage.fiche.p-dys,.stage.fiche.p-tdah{font-family:'Lexend',sans-serif}
.fiche .pg{position:relative;width:794px;height:1123px;background:var(--paper);box-shadow:0 6px 24px rgba(0,0,0,.18);flex:none;overflow:hidden}
.fiche .pgc{position:absolute;inset:68px 45px 78px;overflow:hidden;display:flex;flex-direction:column;gap:calc(14px*var(--k,1))}
.fiche .fh{display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--c0);padding-bottom:10px}
.fiche .fe{font-size:calc(44px*var(--k,1));line-height:1}
.fiche .ft{font-family:'Bubblegum Sans','Nunito',sans-serif;font-size:calc(44px*var(--k,1));color:var(--ci0,var(--c0));line-height:1.05}
.fiche.p-dys .ft,.fiche.p-tdah .ft{font-family:'Lexend',sans-serif;font-weight:700;font-size:calc(38px*var(--k,1))}
.fiche .fs{font-size:calc(17px*var(--k,1));color:#333;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.fiche .fban{border:2.5px solid #222;border-radius:10px;padding:7px 13px;font-size:calc(19px*var(--k,1));background:#fff}
.fiche .sec{border-left:6px solid var(--c);background:#fff;border-radius:0 12px 12px 0;padding:8px 14px 10px;cursor:pointer;break-inside:avoid}
.fiche .sec.extra{background:#fff6e6}
.fiche .sec.cadre{border:3.5px solid var(--c);border-radius:14px;background:var(--tint,#fff);padding:10px 16px 12px}
.fiche .sec.cadre h3{font-size:calc(24px*var(--k,1))}
.fiche .sec h3 small{font-size:.7em;font-weight:600}
.fiche .sec.reponses{transform:rotate(180deg)}
.fiche .cadre-test .item.question{background:#fff;margin:8px 0}.fiche .sec h3{margin:0 0 5px;font-size:calc(23px*var(--k,1));color:var(--ci,var(--c));display:flex;align-items:center;gap:8px}
.fiche .sec h3 .num{background:var(--c);color:var(--ct,#fff);border-radius:50%;width:30px;height:30px;display:inline-grid;place-items:center;font-size:16px;flex:none}
.fiche .sec h3 .ck{margin-left:auto;color:#222;font-size:calc(24px*var(--k,1))}
.fiche .sb{font-size:calc(20px*var(--k,1));line-height:1.45;color:#111}
.fiche.p-dys .sb{font-size:calc(21px*var(--k,1));line-height:1.7;letter-spacing:.04em;word-spacing:.14em}
.fiche.p-tdah .sb{line-height:1.6}
.fiche .item{margin:4px 0}
.fiche .hl{background:#fff2a8;color:#222;border-radius:4px;padding:0 3px;font-weight:700}
.fiche .item.cle{background:#fff2a8}
.fiche.p-dys .item.exemple,.fiche.p-tdah .item.exemple{font-style:normal}
.fiche .pnum{position:absolute;right:45px;top:45px;font:600 15px system-ui,sans-serif;color:#444}
.fiche .foot{left:45px;bottom:45px;font-size:15px}.fiche .mark{right:45px;bottom:45px;font-size:17px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#copie){display:none!important}
  #copie{position:static;left:auto;width:auto}
  #copie .stage{height:auto!important;gap:0}
  #copie .pg{box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<main id="app"></main>
<div id="copie" aria-hidden="true"></div>
<script src="config.js"></script>
<script src="exo.js"></script>
<script src="app.js"></script>
</body>
</html>
